# Response headers every ReelStash page and API response carries. Included at
# server level and again in each location that sets its own add_header, since
# nginx drops inherited add_header directives in such a location.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
