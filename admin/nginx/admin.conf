# ReelStash Admin (admin.html), Files (files.html) and Downloads (downloads.html): React apps served together
# as the reelstash-admin service (admin.reelstash.example, media.local:8001).
server {
    listen 3091;
    server_name localhost;
    root /usr/share/nginx/html;
    # Relative Location headers: the container port (3091) is not the one browsers use (8001, 443).
    absolute_redirect off;

    location = / {
        return 302 /admin$is_args$args;
    }

    location /files {
        try_files $uri /files.html;
    }

    location /downloads {
        try_files $uri /downloads.html;
    }

    location / {
        try_files $uri /admin.html;
    }

    include /etc/nginx/reelstash/api.conf;
}
