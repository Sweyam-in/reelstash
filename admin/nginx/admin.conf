# ReelStash Admin (admin.html), Files (files.html) and Downloads (downloads.html): React apps served together
# as the reelstash-admin service (admin.reelstash.example, media.local:8001).
server {
    listen 3091;
    server_name localhost;
    root /usr/share/nginx/html;
    # Relative Location headers: the container port (3091) is not the one browsers use (8001, 443).
    absolute_redirect off;
    # .torrent files are often over nginx's 1 MB default. The API accepts 64 MB
    # for the whole add request and 10 MB for one file.
    client_max_body_size 64m;

    location = / {
        return 302 /admin$is_args$args;
    }

    # Hashed build files. A missing one must be a 404, not admin.html, or the
    # browser refuses it as a module script served with a text/html type.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location /files {
        try_files $uri /files.html;
    }

    location /downloads {
        try_files $uri /downloads.html;
    }

    location / {
        try_files $uri /admin.html;
    }

    include /etc/nginx/reelstash/api.conf;
}
