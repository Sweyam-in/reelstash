# Backend proxying shared by the media and admin server blocks (included inside server {}).

# Docker's embedded DNS (127.0.0.11). A plain "proxy_pass http://reelstash:8902"
# resolves the hostname once at config-load time, which races the backend
# container's DNS registration on a fresh `docker compose up` and crash-loops
# nginx if it loses. Routing through a variable defers resolution to request
# time against this resolver instead, so it retries per-request rather than
# failing to start.
resolver 127.0.0.11 valid=10s ipv6=off;

# Server-sent events: never buffer or time out the long-lived stream.
location = /api/events {
    set $upstream_api reelstash:8902;
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

# Direct-play video: pass Range requests straight through without
# buffering. With nginx's default proxy_buffering, every seek (a new
# Range request) makes nginx slurp up to 1 GB of the file from the
# backend into a temp file on disk before/while relaying it, so large
# high-bitrate files stall on play and seek.
location ~ ^/api/media/[0-9]+/stream$ {
    set $upstream_api reelstash:8902;
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# File manager move/copy: a paste onto another disk copies the bytes inside
# the request, which can take far longer than nginx's default 60s.
location ~ ^/api/admin/files/(move|copy)$ {
    set $upstream_api reelstash:8902;
    proxy_pass http://$upstream_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# No URI on proxy_pass here (deliberately): with a variable upstream,
# nginx only rewrites the forwarded path when proxy_pass has a static
# URI part — with a variable, that rewriting doesn't happen, and adding
# a URI ("http://$upstream_api/api/") instead makes nginx forward that
# LITERAL path for every request, discarding the real one entirely
# (verified: /auth/login was silently forwarded to the backend as
# bare /auth/, breaking sign-in). No URI = nginx forwards the
# client's original path/query untouched, which is what we want since
# these prefixes already match the Go backend's own routes.
location /api/ {
    set $upstream_api reelstash:8902;
    proxy_pass http://$upstream_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /auth/ {
    set $upstream_api reelstash:8902;
    proxy_pass http://$upstream_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /healthz {
    set $upstream_api reelstash:8902;
    proxy_pass http://$upstream_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
}
