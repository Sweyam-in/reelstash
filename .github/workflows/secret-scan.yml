name: secret-scan

# Fails the build if a credential, private key or token is committed.
# Rules and test-file allowlist live in .gitleaks.toml.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 \
            dir /repo --redact --no-banner --exit-code 1
