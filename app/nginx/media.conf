# ReelStash media library (index.html). Old /admin and /files links land here too; the app
# forwards them to the admin origin.
server {
    listen 3091;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/reelstash/api.conf;
}
