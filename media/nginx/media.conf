# ReelStash media library (index.html). Old /admin and /files links land here too; the app
# forwards them to the admin origin.
server {
    listen 3091;
    server_name localhost;

    # The service worker and the page must revalidate, so a new release reaches people at once.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Built files carry content hashes; they can be cached for good.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/reelstash/api.conf;
}
